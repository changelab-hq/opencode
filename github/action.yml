name: "opencode GitHub Action"
description: "Run opencode in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the opencode session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of OpenCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/opencode,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.opencode.ai"
    required: false

runs:
  using: "composite"
  steps:
    # CHANGELAB FORK: run opencode from this repo's source instead of installing
    # the upstream release binary, so patches to the github handler take effect.
    # The composite action's repo is checked out at github.action_path, so the
    # monorepo root is one level up from this file.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    # hashFiles() can't reach outside the workspace, so hash the lockfile by hand
    - name: Compute lockfile hash
      id: lockhash
      shell: bash
      run: echo "hash=$(sha256sum "${{ github.action_path }}/../bun.lock" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Cache opencode node_modules
      uses: actions/cache@v4
      with:
        path: ${{ github.action_path }}/../node_modules
        key: opencode-source-${{ runner.os }}-${{ runner.arch }}-${{ steps.lockhash.outputs.hash }}

    - name: Install opencode dependencies
      shell: bash
      run: cd "${{ github.action_path }}/.." && bun install --frozen-lockfile

    - name: Run opencode
      shell: bash
      id: run_opencode
      run: bun run --conditions=browser "${{ github.action_path }}/../packages/opencode/src/index.ts" github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
